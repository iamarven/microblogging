openapi: 3.0.3
info:
  title: User Service API
  version: 1.0.0
  description: Endpoints to manage user - CRUD operations.
paths:
  /api/users/me:
    get:
      tags:
        - users
      operationId: getCurrentUser
      summary: Get info about current user
      parameters:
        - in: header
          name: X-User-Id
          schema:
            type: integer
            format: int64
          required: true
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateUserDto'

  /api/users:
    post:
      tags:
        - users
      operationId: createUser
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateDto'
      responses:
        201:
          description: Created
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserDto'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/{id}:
    get:
      tags:
        - users
      operationId: getUser
      summary: Get info about the specified user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserDto'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - users
      operationId: updateUser
      summary: Update user profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
        - in: header
          name: X-User-Id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateDto'
      responses:
        200:
          description: Updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserDto'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - users
      operationId: deleteUser
      summary: Delete user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
        - in: header
          name: X-User-Id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserDto'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/upload/profile-image:
    patch:
      tags:
        - users
      operationId: uploadProfileImage
      summary: Upload profile image
      parameters:
        - in: header
          name: X-User-Id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/{id}/delete/media/{fileType}/{fileName}:
    delete:
      tags:
        - users
      operationId: deleteMedia
      summary: Delete user media file
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
        - in: path
          name: fileType
          required: true
          schema:
            type: string
        - in: path
          name: fileName
          required: true
          schema:
            type: string
        - in: header
          name: X-User-Id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        204:
          description: No Content
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    PrivateUserDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 20
        name:
          type: string
          example: John
        email:
          type: string
          format: email
          example: john@gmail.com
        fullName:
          type: string
          example: John Doe
        bio:
          type: string
          example: I really like playing volleyball
        profileImageUrl:
          type: string
          example: http://example.com/23c6cb3c-e567-4a24-b82a-15dcbaaec39e/avatar.png
        createdAt:
          type: string
          format: date-time
          x-java-type: java.time.Instant
          example: 2025-09-25T13:26:37.417Z
        isActive:
          type: boolean
          example: false

    PublicUserDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 20
        username:
          type: string
          example: John
        fullName:
          type: string
          example: John Doe
        bio:
          type: string
          example: I really like playing volleyball
        profileImageUrl:
          type: string
          example: http://example.com/23c6cb3c-e567-4a24-b82a-15dcbaaec39e/avatar.png
        createdAt:
          type: string
          format: date-time
          x-java-type: java.time.Instant
          example: 2025-09-25T13:26:37.417Z

    UserCreateDto:
      type: object
      required: [ username, email ]
      properties:
        username:
          type: string
          example: John
          maxLength: 50
          minLength: 1
          pattern: '^\S(.*\S)?$'
          x-field-extra-annotation: >
            @jakarta.validation.constraints.NotBlank(message = "Username is required")
        email:
          type: string
          format: email
          maxLength: 100
          x-field-extra-annotation: >
            @jakarta.validation.constraints.Email(message = "Email is required")
        fullName:
          type: string
          example: John Doe
          maxLength: 100
        bio:
          type: string
          example: I'm keen on developing web applications

    UserUpdateDto:
      type: object
      properties:
        fullName:
          type: string
          example: Robert Martin
        bio:
          type: string
          example: I always try to do my best
        profileImageUrl:
          type: string
          example: http://example.com/23c6cb3c-e567-4a24-b82a-15dcbaaec39e/new_avatar.png

    FileUploadResponse:
      type: object
      properties:
        fileName:
          type: string
        originalFileName:
          type: string
        fileUrl:
          type: string
        fileSize:
          type: integer
        contentType:
          type: string
        uploadedAt:
          type: string
          format: date-time
          x-java-type: java.time.Instant
          example: 2025-09-25T13:26:37.417Z

    Error:
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: Bad Request
        exceptionMessage:
          type: string
          example: User with name 'Anton' already exists
        timestamp:
          type: string
          format: date-time
          example: 2025-07-03T12:30:00Z
